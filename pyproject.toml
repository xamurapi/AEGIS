[tool.pytest.ini_options]
# BDD feature files live next to the step defs under tests/.
testpaths = ["tests"]
bdd_features_base_dir = "tests/"
filterwarnings = [
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["aegis"]
# NOTHING is excluded from measurement. `aegis/api/*` and `aegis/eval/sandbox.py`
# used to be omitted here as "not unit-covered" — and the round-3 audit then found
# a CRITICAL sandbox escape plus two dead API endpoints in exactly those files.
# An unmeasured module is an unguarded one, so the gate now covers the package.
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage control: the suite fails if total branch coverage of the whole
# package drops below this gate. Ratcheted 85 -> 90 once the previously
# unmeasured modules were brought up (package total is currently 92%).
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "logger.exception",
    "logger.warning",
]

# NOTE: there is deliberately no [tool.mutmut] section. mutmut needs WSL on
# Windows and mutatest 3.1.0 is broken on Python 3.11, so mutation testing runs
# through the in-repo harness instead, which owns its own target list:
#
#     python scripts/mutation_test.py            # every target module
#     python scripts/mutation_test.py sandbox    # one module by keyword
#
# The harness exits non-zero if any non-equivalent mutant survives (CI gate).
